<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192-v2.png" />
    <!-- viewport-fit=cover so the app can paint under the notch/home indicator once
         installed; the safe-area padding below keeps content clear of both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Q Drops</title>
    <meta name="description" content="An open archive for Q research. Every drop, searchable and cross-referenced." />

    <!-- Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e1a" />

    <!-- iOS ignores the manifest for these, so they have to be declared separately. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Q Drops" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
